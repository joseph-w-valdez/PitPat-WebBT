<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PitPat Treadmill Control (Web Bluetooth)</title>
    <!-- MDL CSS & JS -->
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.blue-light_blue.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #0c0f14;
            --surface: #171c26;
            --text: #f4f7fb;
            --muted: #9aa6b8;
            --line: rgba(255, 255, 255, 0.08);
            --accent: #3dd6c6;
            --green: #3ddc84;
            --red: #ff5d6c;
            --amber: #f5c451;
        }
        html, body {
            height: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            margin: 0;
            background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }
        .app-bar {
            padding: 1.1rem 1.25rem 0.2rem;
        }
        .brand {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 0.4rem 1.25rem 2.5rem;
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
        }
        .page > * {
            min-width: 0;
            max-width: 100%;
        }
        .stage {
            width: min(1120px, 100%);
            max-width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            width: 100%;
        }
        .mdl-card {
            margin: 0;
            min-height: 0;
            height: auto;
            width: auto;
            background: var(--surface) !important;
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: none !important;
            text-align: left;
            padding: 1rem 1.1rem 0.9rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-speed {
            grid-column: 1 / -1;
        }
        .mdl-card__title {
            justify-content: flex-start;
            padding: 0;
            min-height: unset;
            width: 100%;
        }
        .mdl-card__supporting-text {
            padding: 0;
            width: 100%;
        }
        .card-title {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }
        .card-value {
            font-size: 1.45rem;
            margin-top: 0.25rem;
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        .stat-speed .card-value {
            font-size: clamp(3rem, 8vw, 4.6rem) !important;
            color: var(--accent) !important;
            line-height: 1 !important;
        }
        .control-dock {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 1rem;
            box-sizing: border-box;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            width: 100%;
            margin: 0;
            justify-content: stretch;
            box-sizing: border-box;
        }
        .slider-group { width: 100%; margin: 0.25rem 0 0; }
        .slider-label { margin-bottom: 0.45rem; display: block; color: var(--muted); font-size: 0.95rem; }
        #sliderValue { color: var(--text); font-weight: 700; }
        #status { margin-top: 1em; text-align: center; }
        .mdl-slider { width: 100%; }
        .mdl-textfield { flex: 1; }
        .mdl-button {
            border-radius: 14px !important;
            text-transform: none !important;
            letter-spacing: 0 !important;
            font-weight: 650 !important;
            min-height: 48px;
            box-shadow: none !important;
        }
        .controls .mdl-button {
            flex: 1 1 140px;
            min-width: 0;
            margin: 0;
        }
        .belt-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .belt-controls .mdl-button,
        .preset-btn {
            width: 100%;
            min-width: 0 !important;
        }
        .preset-label {
            margin: 0.15rem 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .presets {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
        }
        .preset-btn {
            background: #222a38 !important;
            color: var(--text) !important;
            border: 1px solid var(--line);
            padding: 0 0.2rem !important;
        }
        .preset-btn.is-selected {
            background: var(--accent) !important;
            color: #06221f !important;
            border-color: transparent;
        }
        .history {
            width: min(1120px, 100%);
            max-width: 100%;
            min-width: 0;
        }
        .history h2 {
            margin: 0 0 0.8rem;
            font-size: 1.15rem;
            letter-spacing: -0.03em;
        }
        #connectBtn {
            width: 100%;
            background: var(--accent) !important;
            color: #06221f !important;
        }
        .btn-red {
            background-color: var(--red) !important;
            color: #fff !important;
        }
        .btn-green {
            background-color: var(--green) !important;
            color: #06210f !important;
        }
        .mdl-button[disabled],
        .btn-red:disabled,
        .btn-green:disabled {
            opacity: 0.38 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
        }
        .mdl-chip {
            height: auto !important;
            border-radius: 999px !important;
            padding: 0.15rem 0.2rem;
        }
        .chip-connected { background: var(--green) !important; color: #06210f !important; }
        .chip-connecting { background: var(--amber) !important; color: #2a2208 !important; }
        .chip-disconnected { background: #3a2a30 !important; color: #ffd5db !important; }
        .chip-paused { background: var(--amber) !important; color: #2a2208 !important; }
        .scan-results { display: none; text-align: center; }
        .history-toolbar, #periodTotals, .history-table-container, #packetCapture {
            width: min(1120px, 100%);
        }
        .history-toolbar {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        #periodTotals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin: 0 0 1rem;
        }
        .total-tile {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 0.9rem 1rem;
        }
        .total-tile span {
            display: block;
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .total-tile strong {
            display: block;
            margin-top: 0.3rem;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
        }
        .history-table-container {
            overflow-x: auto;
            width: 100%;
            max-width: 100%;
        }
        .mdl-data-table {
            background: var(--surface) !important;
            color: var(--text) !important;
            border-radius: 18px;
            width: 100%;
        }
        .mdl-data-table th {
            color: var(--muted) !important;
            font-size: 0.75rem !important;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .mdl-data-table td { color: var(--text) !important; border-color: var(--line) !important; }
        #packetCapture {
            margin-top: 1.25rem;
            color: var(--muted);
            line-height: 1.5;
        }
        #packetCapture h3 { color: var(--text); margin: 0 0 0.4rem; font-size: 1rem; }
        #captureStatusHex, #captureStartHex {
            margin-top: 0.6rem;
            word-break: break-all;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 0.78rem;
        }
        @media (max-width: 520px) {
            .app-bar, .page { padding-left: 0.7rem; padding-right: 0.7rem; }
            .control-dock { padding: 0.75rem; }
            .dashboard { gap: 0.55rem; }
            .stat-speed .card-value { font-size: 2.7rem !important; }
            .belt-controls .mdl-button {
                padding-left: 0.35rem !important;
                padding-right: 0.35rem !important;
            }
        }
        @media (min-width: 720px) {
            .stage {
                display: grid;
                grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.8fr);
                gap: 1.25rem;
                align-items: start;
            }
            .dashboard { grid-template-columns: 1fr 1fr; }
            .control-dock { position: sticky; top: 0.75rem; }
            #periodTotals { grid-template-columns: repeat(4, 1fr); }
            .mdl-data-table th, .mdl-data-table td { padding: 0.85rem 1rem; }
        }
    </style>
</head>
<body>
    <header class="app-bar">
        <span class="brand">PitPat</span>
    </header>
    <main class="page">
                    <div class="stage">
                    <div class="dashboard">
                        <div class="mdl-card mdl-shadow--2dp stat-speed">
                            <div class="mdl-card__title"><span class="card-title">Speed</span></div>
                            <div class="mdl-card__supporting-text card-value" id="speed">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Distance</span></div>
                            <div class="mdl-card__supporting-text card-value" id="distance">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Calories</span></div>
                            <div class="mdl-card__supporting-text card-value" id="calories">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Steps</span></div>
                            <div class="mdl-card__supporting-text card-value" id="steps">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Duration</span></div>
                            <div class="mdl-card__supporting-text card-value" id="duration">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Running State</span></div>
                            <span id="statusChip" class="mdl-chip chip-disconnected" style="vertical-align: middle;"><span class="mdl-chip__text">Disconnected</span></span>
                        </div>
                    </div>
                    <div class="control-dock">
                    <div class="controls">
                        <button id="connectBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--primary">Connect</button>
                    </div>
                    <div id="scanResults" class="scan-results"></div>
                    <p class="preset-label">Start at (mph)</p>
                    <div class="presets">
                        <button type="button" class="preset-btn mdl-button mdl-js-button mdl-button--raised" data-mph="1.5" disabled>1.5</button>
                        <button type="button" class="preset-btn mdl-button mdl-js-button mdl-button--raised" data-mph="2" disabled>2</button>
                        <button type="button" class="preset-btn mdl-button mdl-js-button mdl-button--raised" data-mph="2.5" disabled>2.5</button>
                        <button type="button" class="preset-btn mdl-button mdl-js-button mdl-button--raised" data-mph="3" disabled>3</button>
                    </div>
                    <div class="controls belt-controls">
                        <button id="startBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect btn-green" disabled>Start</button>
                        <button id="stopBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect btn-red" disabled>Stop</button>
                        <button id="speedDownBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect" disabled>Speed Down</button>
                        <button id="speedUpBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect" disabled>Speed Up</button>
                    </div>
                    <div class="slider-group">
                        <label class="slider-label" for="speedSlider">Set speed (mph) <span id="sliderValue">0.6</span></label>
                        <input type="range" id="speedSlider" min="0.6" max="3.7" step="0.1" value="0.6" class="mdl-slider mdl-js-slider">
                    </div>
                    </div>
                    </div>
            <section class="history">
                <h2>History</h2>
                    <div class="history-toolbar">
                        <button id="exportHistoryBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect">Export</button>
                        <button id="importHistoryBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect">Import</button>
                        <input type="file" id="importHistoryInput" accept="application/json" style="display:none;" />
                    </div>
                    <div id="periodTotals"></div>
                    <div class="history-table-container">
                        <table class="mdl-data-table mdl-js-data-table mdl-shadow--2dp" >
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Duration</th>
                                    <th>Distance</th>
                                    <th>Steps</th>
                                    <th>Calories</th>
                                    <th>Avg Speed</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- Sessions will be injected here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="packetCapture">
                        <h3 style="margin:0 0 0.4em;">Saved packets</h3>
                        <div id="captureDecoded">No status packet saved yet.</div>
                        <div id="captureStatusHex" style="margin-top:0.6em;word-break:break-all;font-family:monospace;font-size:0.8em;"></div>
                        <div id="captureStartHex" style="margin-top:0.6em;word-break:break-all;font-family:monospace;font-size:0.8em;"></div>
                    </div>
            </section>
    </main>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,0.7);z-index:9999;align-items:center;justify-content:center;">
        <div class="mdl-spinner mdl-js-spinner is-active" style="width:64px;height:64px;"></div>
    </div>
    <!-- Countdown Overlay -->
    <div id="countdownOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(33,33,33,0.85);z-index:10000;align-items:center;justify-content:center;opacity:1;transition:opacity 0.5s;">
        <span id="countdownNumber" style="color:#fff;font-size:6em;font-weight:bold;transition:transform 0.3s, opacity 0.3s;">3</span>
    </div>
    <!-- Snackbar for toast messages -->
    <div id="snackbar" class="mdl-js-snackbar mdl-snackbar">
        <div class="mdl-snackbar__text"></div>
        <button class="mdl-snackbar__action" type="button"></button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@4.1.0/cdn.min.js"></script>
    <script src="treadmill.js?v=5"></script>
</body>
</html>
